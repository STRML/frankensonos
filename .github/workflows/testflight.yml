name: TestFlight

# Every push to ios-app that touches the iPhone app is built and uploaded to TestFlight. This repository is public, so
# the workflow never runs on pull_request: the Studio runner below must not run anyone else's code.
on:
  push:
    branches: [ios-app]
    paths: ["ios/**", ".github/workflows/testflight.yml"]
    # A release: `git tag v1.1.0 && git push origin v1.1.0` uploads a build whose version is 1.1.0. Every build after
    # that takes its version from the newest release tag.
    tags: ["v[0-9]*"]
  workflow_dispatch:

# Required repository secrets (the same four the dobbysite workflow uses):
#   APPLE_TEAM_ID   10-character Apple Developer team ID
#   ASC_KEY_ID      App Store Connect API key ID (an Admin key: cloud signing for distribution needs it)
#   ASC_ISSUER_ID   App Store Connect issuer ID
#   ASC_KEY_P8      contents of the AuthKey_<id>.p8 file, base64 encoded
# The app record (bundle id com.samuelreed.frankensonos) must already exist in App Store Connect.

jobs:
  check:
    runs-on: [self-hosted, studio]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for the iOS Simulator and run the mock-state check
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build -project FrankenSonos.xcodeproj -scheme FrankenSonos \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO
          swiftc -swift-version 5 FrankenSonos/Model/*.swift FrankenSonos/Net/*.swift check-mock-state.swift \
            -o "$RUNNER_TEMP/mock-check"
          "$RUNNER_TEMP/mock-check"

  upload:
    needs: check
    runs-on: [self-hosted, studio]
    # Uploads queue and are never cancelled mid-flight. A release tag has a group of its own, so a later push can
    # never replace a queued release.
    concurrency:
      group: testflight-${{ github.ref_type == 'tag' && github.ref || 'push' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so it needs the whole history.
          fetch-depth: 0
      # A tag can only release a commit that is on ios-app.
      - name: Check that the tagged commit is on ios-app
        if: github.ref_type == 'tag'
        run: |
          git fetch origin ios-app
          git merge-base --is-ancestor "$GITHUB_SHA" origin/ios-app || { echo "$GITHUB_SHA is not on ios-app."; exit 1; }
      - name: Pick the marketing version from the newest release tag
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          VERSION="${TAG#v}"
          if [ -n "$TAG" ] && ! echo "$VERSION" | grep -E -q '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "Tag $TAG is not a version like v1.4 or v1.4.0."; exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION:-the project default}"
      # App Store Connect rejects builds from SDKs older than the iOS 26 SDK that ships with Xcode 26.
      - name: Select the newest Xcode 26 or later
        run: |
          ACTIVE=$(xcodebuild -version 2>/dev/null | sed -n 's/^Xcode \([0-9]*\).*/\1/p' || true)
          if [ "${ACTIVE:-0}" -ge 26 ]; then
            xcodebuild -version
            exit 0
          fi
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 or later on this runner. Installed:"
            ls -d /Applications/Xcode*
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
      # The Studio also runs the dobbysite runner, and both change the user's default keychain while they sign. Take a
      # lock first so the two never overlap. A lock older than an hour belongs to a job that died and is taken over.
      - name: Take the signing lock
        run: |
          LOCK="$HOME/.ci-signing.lock"
          for _ in $(seq 1 360); do
            if mkdir "$LOCK" 2>/dev/null; then echo "$GITHUB_RUN_ID" > "$LOCK/owner"; exit 0; fi
            if [ -n "$(find "$LOCK" -maxdepth 0 -mmin +60 2>/dev/null)" ]; then rm -rf "$LOCK"; continue; fi
            sleep 10
          done
          echo "Could not take the signing lock in an hour."; exit 1
      # Xcode keeps the private key of its throwaway signing certificate in the default keychain, and the Studio's login
      # keychain cannot be opened from a background service, so signing uses a keychain of its own (see dobbysite).
      - name: Use the CI keychain
        run: |
          KC="$HOME/Library/Keychains/frankensonos-ci.keychain-db"
          if [ ! -f "$KC" ]; then security create-keychain -p "" "$KC"; fi
          security unlock-keychain -p "" "$KC"
          security set-keychain-settings "$KC"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KC"
          # The cleanup job revokes "Created via API" certificates an hour after they were made, and a revoked one that
          # is still in this keychain fails CodeSign with "unable to build chain". Drop what earlier runs left (the
          # key goes with the certificate) so Xcode makes a fresh pair for this archive.
          for _ in $(seq 1 20); do
            HASH=$(security find-identity "$KC" | awk '/Created via API/ {print $2; exit}')
            [ -n "$HASH" ] || break
            security delete-identity -Z "$HASH" "$KC" || break
          done
      - name: Archive
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          VERSION_ARGS=()
          if [ -n "$VERSION" ]; then VERSION_ARGS+=("MARKETING_VERSION=$VERSION"); fi
          xcodebuild archive \
            -project FrankenSonos.xcodeproj \
            -scheme FrankenSonos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/FrankenSonos.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            "${VERSION_ARGS[@]}"
      - name: Fail if the archive has no app icon
        run: ios/tools/check-app-icon "$RUNNER_TEMP/FrankenSonos.xcarchive/Products/Applications/FrankenSonos.app"
      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/__TEAM__/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FrankenSonos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
      - name: Restore the default keychain and release the lock
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          LOCK="$HOME/.ci-signing.lock"
          if [ "$(cat "$LOCK/owner" 2>/dev/null)" = "$GITHUB_RUN_ID" ]; then rm -rf "$LOCK"; fi

  # Every archive on a fresh runner makes a throwaway development certificate through cloud signing, and the account
  # stops allowing new ones at about a dozen. This revokes the ones old enough that no build can still be using them.
  # A failure here is visible but never blocks an upload.
  cleanup:
    needs: upload
    if: always()
    runs-on: [self-hosted, studio]
    steps:
      - uses: actions/checkout@v4
      - name: Install asc
        run: brew install asc
      - name: Revoke old CI certificates
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_KEY_P8 }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: ios/tools/revoke-ci-certificates
