name: FrankenSonos
options:
  bundleIdPrefix: com.samuelreed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  FrankenSonos:
    type: application
    platform: iOS
    sources:
      - path: FrankenSonos
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FrankenSonos
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app only speaks HTTPS or plain HTTP to a daemon the owner runs; nothing here is exempt encryption work.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Connect to your FrankenSonos daemon on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelreed.frankensonos
        PRODUCT_NAME: FrankenSonos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FrankenSonos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
