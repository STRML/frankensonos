name: FrankenSonos
options:
  bundleIdPrefix: dev.frankensonos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FrankenSonos:
    type: application
    platform: iOS
    sources:
      - path: FrankenSonos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.frankensonos.remote
        PRODUCT_NAME: FrankenSonos
        INFOPLIST_KEY_CFBundleDisplayName: FrankenSonos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
